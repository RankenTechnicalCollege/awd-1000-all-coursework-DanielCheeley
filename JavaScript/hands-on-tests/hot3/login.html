<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/login.js" defer></script>
</head>
<body>
  <form action="javascript:void(0)">
  <fieldset>
    <legend>Email:</legend>
    <input type="email" name="email" id="email" autocomplete="email" class="form-control input" placeholder="email@example.com">
  </fieldset>
  <fieldset>
    <legend>Password:</legend>
    <input type="password" name="password" id="pwd" autocomplete="current-password" class="form-control input" placeholder="password">
  </fieldset>
  <button type="submit" class="btn btn-primary" id="submitBtn" formnovalidate>Login</button>
  <div id="errorBox" class="text-danger"></div>
  </form>
</body>
</html>
