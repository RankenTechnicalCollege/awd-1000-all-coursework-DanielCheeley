<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upvote and Downvote</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/upDown.css">
  <script src="js/upDown.js" defer></script>
</head>
<body>
  <h2>Rate Our Products:</h2>
  <p>*click the arrows to vote*</p>
  <figure>
    <img src="images/headphones.webp" alt=".." class="productImage">
    <figcaption><img src="images/arrowButton.png" alt="upvote" class="arrow"> Upvotes: <span class="upvotes">0</span> <img src="images/arrowButton.png" alt="downvote" class="downArrow"> Downvotes: <span class="downvotes">0</span><br> Total Score: <span class="total">0</span></figcaption>
  </figure>

  <figure>
    <img src="images/mouse.jpg" alt=".." class="productImage">
    <figcaption><img src="images/arrowButton.png" alt="upvote" class="arrow"> Upvotes: <span class="upvotes">0</span> <img src="images/arrowButton.png" alt="downvote" class="downArrow"> Downvotes: <span class="downvotes">0</span><br> Total Score: <span class="total">0</span></figcaption>
  </figure>

  <figure>
    <img src="images/shoes.jpg" alt=".." class="productImage">
    <figcaption><img src="images/arrowButton.png" alt="upvote" class="arrow"> Upvotes: <span class="upvotes">0</span> <img src="images/arrowButton.png" alt="downvote" class="downArrow"> Downvotes: <span class="downvotes">0</span><br> Total Score: <span class="total">0</span></figcaption>
  </figure>
</body>
</html>
