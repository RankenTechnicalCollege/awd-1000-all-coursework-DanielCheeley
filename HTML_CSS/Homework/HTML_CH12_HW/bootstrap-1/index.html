<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Buissness Form</title>
  </head>
  <body class="bg-img">
    <form class="container" id="order-form" action="/order" method="post">
      <h2>Please Fill Out Your Information.</h2>
      <fieldset>
        <legend>Contact Information</legend>
        <div class="row">
          <div class="col">
            <label for="fName" class="form-label">First Name:</label>
            <input name="fName" id="fName" type="text" placeholder="First Name" autocomplete="given-name">
          </div>
          <div class="col">
            <label for="lName" class="form-label">Last Name:</label>
            <input name="lName" id="lName" type="text" placeholder="Last Name" autocomplete="family-name">
          </div>
          <div class="col">
            <label for="phone" class="form-label">Phone Number:</label>
            <input name="phone" id="phone" type="text" placeholder="(123)-456-7890">
          </div>
          <div class="col">
            <label for="email" class="form-label">Email:</label>
            <input name="email" id="email" type="text" placeholder="email@example.com" autocomplete="email">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Account Information</legend>
        <div class="row">
          <div class="col">
            <label for="aEmail" class="form-label">Account Email:</label>
            <input name="aEmail" id="aEmail" type="text" placeholder="Account Email" autocomplete="email">
          </div>
          <div class="col">
            <label for="aPass" class="form-label">Account Password:</label>
            <input name="aPass" id="aPass" type="text" placeholder="Account Password" autocomplete="current-password">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Card Information</legend>
        <div class="row">
          <div class="col">
            <label for="cNum" class="form-label">Card Number:</label>
            <input name="cNum" type="text" id="cNum" placeholder="123-123-1234" autocomplete="cc-number">
          </div>
          <div class="col">
            <label for="cExp" class="form-label">Experation Date:</label>
            <input name="cExp" type="text" placeholder="DD/MM/YY" id="cExp" autocomplete="cc-exp">
          </div>
          <div class="col">
            <label for="cvv" class="form-label">CVV:</label>
            <input name="cvv" type="text" id="cvv" placeholder="***" autocomplete="cc-csc">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Shipping Address</legend>
        <div class="row">
          <div class="col">
            <label for="street" class="form-label">Address:</label>
            <input name="street" type="text" id="street" placeholder="123 Cherry Ln" autocomplete="address-level1">
          </div>
          <div class="col">
            <label for="street2" class="form-label">Address 2:</label>
            <input name="street2" type="text" id="street2" placeholder="e.g., Apt, Studio, Floor">
          </div>
          <div class="col">
            <label for="city" class="form-label">City:</label>
            <input name="city" type="text" id="city" placeholder="St. Louis">
          </div>
          <div class="col">
            <label for="zip" class="form-label">ZipCode:</label>
            <input name="zip" type="text" id="zip" placeholder="11111" autocomplete="postal-code">
          </div>
          <div class="col">
            <label for="state" class="form-label">State:</label>
            <select name="state" id="state">
              <option value="MO">MO</option>
              <option value="IL">IL</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Billing Address</legend>
        <div class="row">
          <div class="col">
            <label for="check" class="form-label">Billing same as shipping?</label>
            <input type="checkbox" id="check">
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="bStreet" class="form-label">Address:</label>
            <input name="bStreet" id="bStreet" type="text" placeholder="123 Cherry Ln" autocomplete="address-level1">
          </div>
          <div class="col">
            <label for="bStreet2" class="form-label">Address 2:</label>
            <input name="bStreet2" id="bStreet2" type="text" placeholder="e.g., Apt, Studio, Floor" autocomplete="address-level2">
          </div>
          <div class="col">
            <label for="bCity" class="form-label">City:</label>
            <input name="bCity" id="bCity" type="text" placeholder="St. Louis">
          </div>
          <div class="col">
            <label for="bZip" class="form-label">ZipCode:</label>
            <input name="bZip" id="bZip" type="text" placeholder="11111" autocomplete="postal-code">
          </div>
          <div class="col">
            <label for="bState" class="form-label">State:</label>
            <select name="bState" id="bState" class="form-select">
              <option value="MO">MO</option>
              <option value="IL">IL</option>
            </select>
          </div>
        </div>
      </fieldset>
      <button type="submit" id="submit" class="btn-lg btn-warning btn">Submit</button>
    </form>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
